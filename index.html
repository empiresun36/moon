<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太陽帝國晚會活動 - 滿意度調查</title>
    <style>
        :root {
            --primary: #d4af37;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --text-sub: #b0b0b0;
            --border: #333333;
        }

        body {
            font-family: 'Helvetica Neue', Arial, "Microsoft JhengHei", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
        }

        .survey-card {
            background-color: var(--card-bg);
            border: 1px solid var(--primary);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.15);
            max-width: 600px;
            width: 100%;
            padding: 30px 25px;
            box-sizing: border-box;
            position: relative;
        }

        h1 {
            color: var(--primary);
            font-size: 24px;
            text-align: center;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .intro {
            color: var(--text-sub);
            font-size: 14px;
            line-height: 1.6;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .form-group:last-of-type {
            border-bottom: none;
        }

        label.question-title {
            display: block;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--primary);
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            background: #2a2a2a;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 15px;
        }

        .option-label:hover {
            background: #333333;
        }

        .option-label input[type="radio"],
        .option-label input[type="checkbox"] {
            margin-right: 12px;
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
        }

        textarea {
            width: 100%;
            height: 100px;
            background-color: #2a2a2a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            padding: 12px;
            box-sizing: border-box;
            font-size: 14px;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .submit-btn {
            width: 100%;
            background-color: var(--primary);
            color: #000;
            font-weight: bold;
            font-size: 16px;
            padding: 14px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #f3cf55;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.4);
        }

        /* 隱藏的 iframe 用於背景送出表單 */
        #hidden_iframe {
            display: none;
        }

        /* 自訂送出成功的感謝訊息樣式 */
        .thank-you-message {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .thank-you-message h2 {
            color: var(--primary);
            font-size: 26px;
            margin-bottom: 15px;
        }

        .thank-you-message p {
            color: var(--text-sub);
            font-size: 16px;
            line-height: 1.6;
        }

        .checkmark {
            font-size: 50px;
            color: var(--primary);
            margin-bottom: 20px;
        }
        /* 新增：單行文字輸入框樣式 */
.text-input {
    width: 100%;
    background-color: #2a2a2a;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 12px;
    box-sizing: border-box;
    font-size: 15px;
}

.text-input:focus {
    outline: none;
    border-color: var(--primary);
}
    </style>
</head>
<body>

<div class="survey-card">

    <!-- 表單區域 -->
    <div id="surveyFormArea">
        <h1>太陽帝國晚會活動滿意度調查</h1>
        <p class="intro">親愛的住戶/貴賓您好，感謝您參與本次晚會！請填寫以下問卷，協助我們做得更好。</p>

        <!-- ⚠️ target 設定指向隱藏的 iframe，送出時觸發 onSubmit JavaScript -->
        <form id="surveyForm" 
              action="https://docs.google.com/forms/d/e/1FAIpQLSevC6qSlQOApWJvgojY2pRWEwPtweIhQG4sFmEuwilIGXFGig/formResponse" 
              method="POST" 
              target="hidden_iframe" 
              onsubmit="submitted=true;">
<!-- 新增：戶號欄位 -->
<div class="form-group">
    <label class="question-title">戶號（例：B3-36F）：</label>
    <!-- ⚠️ 請將 entry.0000000 替換為 Google Form 對應的戶號欄位 ID -->
    <input type="text" name="entry.507088190" class="text-input" placeholder="例：B3-36F" required>
</div>
            <!-- 第 1 題：整體流程滿意度 -->
            <div class="form-group">
                <label class="question-title">1. 您對本次晚會活動的整體流程安排是否滿意？</label>
                <div class="options-group">
                    <label class="option-label">
                        <input type="radio" name="entry.825881667" value="非常滿意" required> 非常滿意
                    </label>
                    <label class="option-label">
                        <input type="radio" name="entry.825881667" value="滿意"> 滿意
                    </label>
                    <label class="option-label">
                        <input type="radio" name="entry.825881667" value="普通"> 普通
                    </label>
                    <label class="option-label">
                        <input type="radio" name="entry.825881667" value="不滿意"> 不滿意
                    </label>
                </div>
            </div>

            <!-- 第 2 題：餐點滿意度 -->
            <div class="form-group">
                <label class="question-title">2. 您對晚會現場提供的餐點品質與安排滿意度如何？</label>
                <div class="options-group">
                    <label class="option-label">
                        <input type="radio" name="entry.540159997" value="非常滿意" required> 非常滿意
                    </label>
                    <label class="option-label">
                        <input type="radio" name="entry.540159997" value="滿意"> 滿意
                    </label>
                    <label class="option-label">
                        <input type="radio" name="entry.540159997" value="普通"> 普通
                    </label>
                    <label class="option-label">
                        <input type="radio" name="entry.540159997" value="不滿意"> 不滿意
                    </label>
                </div>
            </div>

            <!-- 第 3 題：最喜歡的節目項目（可複選） -->
            <div class="form-group">
                <label class="question-title">3. 本次晚會中，您最喜歡哪些節目/活動？（可複選）</label>
                <div class="options-group">
                    <label class="option-label">
                        <input type="checkbox" name="entry.1745200572" value="樂器演奏"> 1. 樂器演奏
                    </label>
                    <label class="option-label">
                        <input type="checkbox" name="entry.1745200572" value="唱歌"> 2. 唱歌
                    </label>
                    <label class="option-label">
                        <input type="checkbox" name="entry.1745200572" value="跳舞"> 3. 跳舞
                    </label>
                    <label class="option-label">
                        <input type="checkbox" name="entry.1745200572" value="遊戲活動"> 4. 遊戲活動
                    </label>
                    <label class="option-label">
                        <input type="checkbox" name="entry.1745200572" value="餐點"> 5. 餐點
                    </label>
                    <label class="option-label">
                        <input type="checkbox" name="entry.1745200572" value="童玩機器"> 6. 童玩機器
                    </label>
                    <label class="option-label">
                        <input type="checkbox" name="entry.1745200572" value="摸彩"> 7. 摸彩
                    </label>
                </div>
            </div>

            <!-- 第 4 題：未來參加意願 -->
            <div class="form-group">
                <label class="question-title">4. 未來若再次舉辦類似晚會活動，您是否有意願參加？</label>
                <div class="options-group">
                    <label class="option-label">
                        <input type="radio" name="entry.984228194" value="非常有意願" required> 非常有意願
                    </label>
                    <label class="option-label">
                        <input type="radio" name="entry.984228194" value="有意願"> 有意願
                    </label>
                    <label class="option-label">
                        <input type="radio" name="entry.984228194" value="視時間而定"> 視時間而定
                    </label>
                    <label class="option-label">
                        <input type="radio" name="entry.984228194" value="無意願"> 無意願
                    </label>
                </div>
            </div>

            <!-- 第 5 題：文字意見 -->
            <div class="form-group">
                <label class="question-title">5. 其他寶貴建議或改進意見（選填）：</label>
                <textarea name="entry.898296088" placeholder="歡迎留下您對活動的建議，幫助我們下次做得更好..."></textarea>
            </div>

            <button type="submit" class="submit-btn">送出滿意度問卷</button>
        </form>
    </div>

    <!-- 自訂送出成功訊息 (預設隱藏) -->
    <div id="thankYouArea" class="thank-you-message">
        <div class="checkmark">✔</div>
        <h2>感謝您的填寫！</h2>
        <p>您的寶貴意見已成功送出。<br>太陽帝國管理委員會感謝您的參與，祝您有美好的一天！</p>
    </div>

</div>

<!-- 用於在背景傳送 Google Form 資料的隱藏 iframe -->
<script type="text/javascript">
    var submitted = false;
</script>
<iframe name="hidden_iframe" id="hidden_iframe" onload="if(submitted) {
    document.getElementById('surveyFormArea').style.display = 'none';
    document.getElementById('thankYouArea').style.display = 'block';
}"></iframe>

</body>
</html>
